# Render blueprint — backend NestJS service on the free tier (no credit card).
#
# Free-tier note: Render's persistent disks are a paid add-on, so SQLite data
# lives in the container's ephemeral filesystem. The DB resets when the instance
# sleeps (after 15 min idle) or redeploys. For a class demo this is fine — events
# created during the presentation persist for the duration of the session.
# To make it truly persistent later, add a `disk:` block and upgrade.
services:
  - type: web
    name: smart-eticketing-backend
    runtime: node
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DRIVER
        value: sqlite
      - key: SQLITE_PATH
        value: /opt/render/project/src/data/eticketing.db
      - key: PORT
        value: 4000
    healthCheckPath: /api-docs
